<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Team One Tour – 프로그램 목록</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f7f7f7; }
        header { background: #1a1a1a; color: white; padding: 15px 30px; }
        .container { max-width: 1100px; margin: auto; padding: 40px 20px; }
        h1 { text-align: center; margin-bottom: 40px; }
        .card-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 25px; }
        .card { background: white; border-radius: 8px; padding: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
        .card img { width: 100%; border-radius: 6px; }
        .card h3 { margin: 15px 0 10px; }
        .card p { color: #555; }
        .btn { display: inline-block; margin-top: 10px; padding: 10px 20px; background: #0078ff; color: white; text-decoration: none; border-radius: 6px; }
    </style>
</head>
<body>

<header>
    <h2>프로그램 탐색</h2>
</header>

<div class="container">
    <h1>UAE 현지 프로그램 목록</h1>

    <div class="card-grid">

        <div class="card">
            <img src="desert.jpg">
            <h3>Dubai Desert Safari</h3>
            <p>사막 투어 · BBQ 디너 포함</p>
            <a class="btn" href="desert-safari.html">자세히 보기</a>
        </div>

        <div class="card">
            <img src="abudhabi.jpg">
            <h3>Abu Dhabi City Tour</h3>
            <p>셰이크자이드 모스크 · 시티 투어</p>
            <a class="btn" href="abu-dhabi-tour.html">자세히 보기</a>
        </div>

        <div class="card">
            <img src="dhow.jpg">
            <h3>Dhow Cruise Dinner</h3>
            <p>두바이 마리나 야경 · 디너 크루즈</p>
            <a class="btn" href="dhow-cruise.html">자세히 보기</a>
        </div>

    </div>
</div>

</body>
</html>
